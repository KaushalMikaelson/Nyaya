name: Nyaay CI & Retrieval Regression Gate

on:
  push:
    branches: [main, master, "phase*"]
  pull_request:
    branches: [main, master]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rag/requirements.txt pytest

      # ── Database & Embeddings Architecture in CI ───────────────
      # In CI:
      # 1. Embeddings: FastEmbed ONNX runs locally via ONNX Runtime CPU
      #    (sentence-transformers/all-MiniLM-L6-v2) with zero paid API calls.
      # 2. Database: Connects to PostgreSQL with pgvector (via services container
      #    or DATABASE_URL secret).
      # 3. Reranker: Paid Cohere API calls are skipped (--ci mode in regression_gate.py)
      #    preventing external API billing and rate-limit flakiness.
      # ────────────────────────────────────────────────────────────

      - name: Run Metric Unit Tests
        run: |
          python eval/test_metrics.py

      - name: Run Resilience Failure-Injection Tests
        run: |
          python eval/test_resilience.py

      - name: Run Cache Isolation & Circuit Breaker Tests
        run: |
          python rag/tests/test_cache_isolation.py
          python rag/tests/test_resilience_and_circuit_breaker.py

      - name: Run Trust Boundary Tests
        run: |
          python rag/tests/test_trust_boundary.py

      - name: Run Agent Hardening Tests
        run: |
          python rag/tests/test_agent_hardening.py

      - name: Validate Query Dataset Structure
        run: |
          python eval/validate_dataset.py --skip-db-check

      - name: Run Retrieval Regression Gate (Bootstrap CI)
        if: env.DATABASE_URL != ''
        run: |
          python eval/regression_gate.py --split dev --ci

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck Backend
        working-directory: backend
        run: npx tsc --noEmit
